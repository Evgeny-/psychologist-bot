  <text x="266" y="379" font-size="20" fill="#537995">2:14</text>
  <text x="153" y="437" font-size="28" fill="#243c50">“I had a rough meeting today.</text>
  <text x="153" y="478" font-size="28" fill="#243c50">But I went for a walk afterwards</text>
